<!doctype html>
<html lang="ms"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b36"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css">
  <title>Smart eRPH AI</title>
</head><body>
<main class="phone-shell">
  <header class="topbar"><div><p class="eyebrow"></p><h1>Smart eRPH <span>AI</span></h1></div><div class="secure-badge">Ready</div></header>
  <section class="hero"><p class="hero-label"></p><h2>RPH siap untuk<br>semua kelas.</h2><p>Pilih minggu dan tarikh Isnin. Hari cuti hanya perlu untick.</p></section>
  <section class="card setup-card"><label for="week">Minggu</label><select id="week" aria-label="Pilih minggu"></select><label for="monday">Tarikh Isnin</label><input id="monday" type="date" aria-label="Pilih tarikh Isnin"><p class="helper" id="mondayHint"></p></section>
  <section class="days-section"><div class="section-heading"><h2>Hari untuk dijana</h2><button class="text-button" id="selectAll">Tanda semua</button></div><div class="days-card" id="daysList"></div></section>
  <button class="generate-button" id="generateButton"><span>✦</span> Jana eRPH Mingguan</button>
  <section class="status-card hidden" id="statusCard" aria-live="polite"><div class="spinner" id="spinner"></div><div><strong id="statusTitle">Sedang menyediakan eRPH</strong><p id="statusText">Sila tunggu sebentar.</p></div></section>
</main>
<script src="app.js"></script></body></html>
